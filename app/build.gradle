plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.bantinsang'
    compileSdk 34

    defaultConfig {
        applicationId 'vn.bantinsang'
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '1.8'
    }

    signingConfigs {
        // Khóa ký cố định để các bản cập nhật cài đè được lên bản cũ.
        fixed {
            storeFile file('bantin.keystore')
            storePassword 'bantinsang'
            keyAlias 'bantin'
            keyPassword 'bantinsang'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
